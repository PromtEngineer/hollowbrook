<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">One next-token distribution, reshaped by the sampling knobs</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#64748b">Same 8 candidate tokens in every panel; bar height = probability. Dashed bars are removed (set to −∞ before the softmax).</text>

  <!-- Panel 1: raw T=1 -->
  <g transform="translate(40,80)">
    <text x="130" y="0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">softmax(logits), T = 1.0</text>
    <line x1="20" y1="170" x2="250" y2="170" stroke="#64748b"/>
    <line x1="20" y1="170" x2="20" y2="20" stroke="#64748b"/>
    <rect x="30" y="80" width="22" height="90" fill="#2563eb" fill-opacity="0.85"/>
    <rect x="58" y="110" width="22" height="60" fill="#2563eb" fill-opacity="0.85"/>
    <rect x="86" y="130" width="22" height="40" fill="#2563eb" fill-opacity="0.85"/>
    <rect x="114" y="140" width="22" height="30" fill="#2563eb" fill-opacity="0.85"/>
    <rect x="142" y="150" width="22" height="20" fill="#2563eb" fill-opacity="0.85"/>
    <rect x="170" y="156" width="22" height="14" fill="#2563eb" fill-opacity="0.85"/>
    <rect x="198" y="160" width="22" height="10" fill="#2563eb" fill-opacity="0.85"/>
    <rect x="226" y="164" width="22" height="6" fill="#2563eb" fill-opacity="0.85"/>
    <g font-size="10" fill="#0f172a" text-anchor="middle">
      <text x="41" y="184">the</text><text x="69" y="184">a</text><text x="97" y="184">his</text><text x="125" y="184">an</text>
      <text x="153" y="184">her</text><text x="181" y="184">one</text><text x="209" y="184">two</text><text x="237" y="184">zebra</text>
    </g>
    <text x="130" y="204" text-anchor="middle" font-size="11" fill="#64748b">.33 .22 .15 .11 .07 .05 .04 .02 — entropy ≈ 2.6 bits</text>
  </g>

  <!-- Panel 2: T=0.5 sharper -->
  <g transform="translate(330,80)">
    <text x="130" y="0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">T = 0.5 (logits ÷ 0.5): sharper</text>
    <line x1="20" y1="170" x2="250" y2="170" stroke="#64748b"/>
    <line x1="20" y1="170" x2="20" y2="20" stroke="#64748b"/>
    <rect x="30" y="30" width="22" height="140" fill="#f59e0b" fill-opacity="0.85"/>
    <rect x="58" y="108" width="22" height="62" fill="#f59e0b" fill-opacity="0.85"/>
    <rect x="86" y="141" width="22" height="29" fill="#f59e0b" fill-opacity="0.85"/>
    <rect x="114" y="155" width="22" height="15" fill="#f59e0b" fill-opacity="0.85"/>
    <rect x="142" y="164" width="22" height="6" fill="#f59e0b" fill-opacity="0.85"/>
    <rect x="170" y="167" width="22" height="3" fill="#f59e0b" fill-opacity="0.85"/>
    <rect x="198" y="168" width="22" height="2" fill="#f59e0b" fill-opacity="0.85"/>
    <rect x="226" y="169" width="22" height="1" fill="#f59e0b" fill-opacity="0.85"/>
    <text x="130" y="204" text-anchor="middle" font-size="11" fill="#64748b">.52 .23 .11 .06 .02 .01 .01 .00 — entropy ≈ 1.9 bits</text>
    <text x="130" y="220" text-anchor="middle" font-size="11" fill="#64748b">T → 0 gives greedy (all mass on "the")</text>
  </g>

  <!-- Panel 3: T=2 flatter -->
  <g transform="translate(620,80)">
    <text x="130" y="0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">T = 2.0 (logits ÷ 2): flatter</text>
    <line x1="20" y1="170" x2="250" y2="170" stroke="#64748b"/>
    <line x1="20" y1="170" x2="20" y2="20" stroke="#64748b"/>
    <rect x="30" y="112" width="22" height="58" fill="#dc2626" fill-opacity="0.85"/>
    <rect x="58" y="122" width="22" height="48" fill="#dc2626" fill-opacity="0.85"/>
    <rect x="86" y="130" width="22" height="40" fill="#dc2626" fill-opacity="0.85"/>
    <rect x="114" y="136" width="22" height="34" fill="#dc2626" fill-opacity="0.85"/>
    <rect x="142" y="142" width="22" height="28" fill="#dc2626" fill-opacity="0.85"/>
    <rect x="170" y="146" width="22" height="24" fill="#dc2626" fill-opacity="0.85"/>
    <rect x="198" y="149" width="22" height="21" fill="#dc2626" fill-opacity="0.85"/>
    <rect x="226" y="153" width="22" height="17" fill="#dc2626" fill-opacity="0.85"/>
    <text x="130" y="204" text-anchor="middle" font-size="11" fill="#64748b">.21 .18 .15 .13 .10 .09 .08 .06 — entropy ≈ 2.9 bits</text>
    <text x="130" y="220" text-anchor="middle" font-size="11" fill="#64748b">"zebra" now has a real chance</text>
  </g>

  <!-- Panel 4: top-k=3 -->
  <g transform="translate(40,320)">
    <text x="130" y="0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">top-k = 3: keep 3, renormalise</text>
    <line x1="20" y1="170" x2="250" y2="170" stroke="#64748b"/>
    <line x1="20" y1="170" x2="20" y2="20" stroke="#64748b"/>
    <rect x="30" y="50" width="22" height="120" fill="#16a34a" fill-opacity="0.85"/>
    <rect x="58" y="90" width="22" height="80" fill="#16a34a" fill-opacity="0.85"/>
    <rect x="86" y="116" width="22" height="54" fill="#16a34a" fill-opacity="0.85"/>
    <rect x="114" y="140" width="22" height="30" fill="none" stroke="#64748b" stroke-dasharray="3 3"/>
    <rect x="142" y="150" width="22" height="20" fill="none" stroke="#64748b" stroke-dasharray="3 3"/>
    <rect x="170" y="156" width="22" height="14" fill="none" stroke="#64748b" stroke-dasharray="3 3"/>
    <rect x="198" y="160" width="22" height="10" fill="none" stroke="#64748b" stroke-dasharray="3 3"/>
    <rect x="226" y="164" width="22" height="6" fill="none" stroke="#64748b" stroke-dasharray="3 3"/>
    <text x="130" y="190" text-anchor="middle" font-size="11" fill="#64748b">.47 .31 .21 — the other 5 get exactly 0</text>
  </g>

  <!-- Panel 5: top-p=0.8 -->
  <g transform="translate(330,320)">
    <text x="130" y="0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">top-p = 0.8: smallest set with mass ≥ 0.8</text>
    <line x1="20" y1="170" x2="250" y2="170" stroke="#64748b"/>
    <line x1="20" y1="170" x2="20" y2="20" stroke="#64748b"/>
    <rect x="30" y="66" width="22" height="104" fill="#16a34a" fill-opacity="0.85"/>
    <rect x="58" y="101" width="22" height="69" fill="#16a34a" fill-opacity="0.85"/>
    <rect x="86" y="123" width="22" height="47" fill="#16a34a" fill-opacity="0.85"/>
    <rect x="114" y="135" width="22" height="35" fill="#16a34a" fill-opacity="0.85"/>
    <rect x="142" y="150" width="22" height="20" fill="none" stroke="#64748b" stroke-dasharray="3 3"/>
    <rect x="170" y="156" width="22" height="14" fill="none" stroke="#64748b" stroke-dasharray="3 3"/>
    <rect x="198" y="160" width="22" height="10" fill="none" stroke="#64748b" stroke-dasharray="3 3"/>
    <rect x="226" y="164" width="22" height="6" fill="none" stroke="#64748b" stroke-dasharray="3 3"/>
    <text x="130" y="190" text-anchor="middle" font-size="11" fill="#64748b">.33+.22+.15+.11 = .81 ≥ .8 → keep 4 (k adapts to the shape)</text>
  </g>

  <!-- Panel 6: min-p=0.2 -->
  <g transform="translate(620,320)">
    <text x="130" y="0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">min-p = 0.2: keep p ≥ 0.2 × p_max</text>
    <line x1="20" y1="170" x2="250" y2="170" stroke="#64748b"/>
    <line x1="20" y1="170" x2="20" y2="20" stroke="#64748b"/>
    <rect x="30" y="66" width="22" height="104" fill="#7c3aed" fill-opacity="0.85"/>
    <rect x="58" y="101" width="22" height="69" fill="#7c3aed" fill-opacity="0.85"/>
    <rect x="86" y="123" width="22" height="47" fill="#7c3aed" fill-opacity="0.85"/>
    <rect x="114" y="135" width="22" height="35" fill="#7c3aed" fill-opacity="0.85"/>
    <rect x="142" y="150" width="22" height="20" fill="#7c3aed" fill-opacity="0.85"/>
    <rect x="170" y="156" width="22" height="14" fill="none" stroke="#64748b" stroke-dasharray="3 3"/>
    <rect x="198" y="160" width="22" height="10" fill="none" stroke="#64748b" stroke-dasharray="3 3"/>
    <rect x="226" y="164" width="22" height="6" fill="none" stroke="#64748b" stroke-dasharray="3 3"/>
    <line x1="20" y1="152" x2="250" y2="152" stroke="#dc2626" stroke-dasharray="4 3"/>
    <text x="240" y="148" text-anchor="end" font-size="10" fill="#dc2626">threshold 0.2 × .33 = .066</text>
    <text x="130" y="190" text-anchor="middle" font-size="11" fill="#64748b">threshold scales with confidence: strict when sure, loose when unsure</text>
  </g>
</svg>
