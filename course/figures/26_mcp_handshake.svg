<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="system-ui, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
    <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
  </defs>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">MCP: host, client and server, and the JSON-RPC messages between them (protocol 2025-11-25)</text>

  <!-- lifelines -->
  <rect x="30" y="44" width="200" height="40" rx="8" fill="#7c3aed" fill-opacity="0.10" stroke="#7c3aed"/>
  <text x="130" y="61" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Host: the Agent loop</text>
  <text x="130" y="76" text-anchor="middle" font-size="10" fill="#64748b">model + permission gate + hooks</text>
  <rect x="290" y="44" width="200" height="40" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb"/>
  <text x="390" y="61" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">MCPClient</text>
  <text x="390" y="76" text-anchor="middle" font-size="10" fill="#64748b">one per server; owns the pipe</text>
  <rect x="580" y="44" width="200" height="40" rx="8" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a"/>
  <text x="680" y="61" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">MCPServer (subprocess)</text>
  <text x="680" y="76" text-anchor="middle" font-size="10" fill="#64748b">python3 -m llm.agent.mcp_mini --serve</text>
  <rect x="800" y="44" width="90" height="40" rx="8" fill="#64748b" fill-opacity="0.12" stroke="#64748b"/>
  <text x="845" y="61" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">ToolRegistry</text>
  <text x="845" y="76" text-anchor="middle" font-size="10" fill="#64748b">the real code</text>
  <line x1="130" y1="84" x2="130" y2="520" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <line x1="390" y1="84" x2="390" y2="520" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <line x1="680" y1="84" x2="680" y2="520" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <line x1="845" y1="84" x2="845" y2="520" stroke="#cbd5e1" stroke-dasharray="4 4"/>

  <!-- transport band -->
  <rect x="400" y="92" width="270" height="18" rx="4" fill="#f59e0b" fill-opacity="0.15"/>
  <text x="535" y="105" text-anchor="middle" font-size="10" fill="#0f172a">transport: stdio, one JSON object per line (or Streamable HTTP)</text>

  <!-- 1 initialize -->
  <path d="M392 130 L676 130" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="535" y="124" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace" fill="#0f172a">{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{…}}}</text>
  <path d="M676 158 L392 158" stroke="#16a34a" stroke-width="1.5" marker-end="url(#al)"/>
  <text x="535" y="152" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace" fill="#0f172a">{"jsonrpc":"2.0","id":1,"result":{"protocolVersion":"2025-11-25","capabilities":{"tools":{}},"serverInfo":{"name":"llm-agent-mini"}}}</text>
  <path d="M392 186 L676 186" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="535" y="180" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace" fill="#0f172a">{"jsonrpc":"2.0","method":"notifications/initialized"}   ← no id = notification = no reply</text>
  <rect x="20" y="118" width="100" height="74" rx="6" fill="#2563eb" fill-opacity="0.08"/>
  <text x="70" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">① handshake</text>
  <text x="70" y="156" text-anchor="middle" font-size="10" fill="#64748b">versions and</text>
  <text x="70" y="170" text-anchor="middle" font-size="10" fill="#64748b">capabilities</text>

  <!-- 2 tools/list -->
  <path d="M132 224 L386 224" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="259" y="218" text-anchor="middle" font-size="10.5" fill="#0f172a">client.list_tools()</text>
  <path d="M392 238 L676 238" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="535" y="232" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace" fill="#0f172a">{"jsonrpc":"2.0","id":2,"method":"tools/list"}</text>
  <path d="M676 266 L392 266" stroke="#16a34a" stroke-width="1.5" marker-end="url(#al)"/>
  <text x="535" y="260" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace" fill="#0f172a">{"id":2,"result":{"tools":[{"name":"calculator","description":"…","inputSchema":{…},"annotations":{"readOnlyHint":true}},…]}}</text>
  <path d="M386 280 L132 280" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="259" y="294" text-anchor="middle" font-size="10.5" fill="#0f172a">mcp_tools_to_registry → Tool(…, read_only = annotations.readOnlyHint or your allowlist)</text>
  <rect x="20" y="212" width="100" height="74" rx="6" fill="#7c3aed" fill-opacity="0.08"/>
  <text x="70" y="234" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">② discovery</text>
  <text x="70" y="250" text-anchor="middle" font-size="10" fill="#64748b">schemas become</text>
  <text x="70" y="264" text-anchor="middle" font-size="10" fill="#64748b">local Tools</text>

  <!-- 3 tools/call -->
  <path d="M132 330 L386 330" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="259" y="324" text-anchor="middle" font-size="10.5" fill="#0f172a">model emits ToolCall → hooks → gate → registry.call → fn(**args)</text>
  <path d="M392 344 L676 344" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="535" y="338" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace" fill="#0f172a">{"id":4,"method":"tools/call","params":{"name":"calculator","arguments":{"expression":"(2 + 3) * 4"}}}</text>
  <path d="M682 358 L840 358" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="762" y="352" text-anchor="middle" font-size="10" fill="#64748b">registry.call()</text>
  <path d="M840 372 L682 372" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="762" y="384" text-anchor="middle" font-size="10" fill="#64748b">"20"</text>
  <path d="M676 392 L392 392" stroke="#16a34a" stroke-width="1.5" marker-end="url(#al)"/>
  <text x="535" y="386" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace" fill="#0f172a">{"id":4,"result":{"content":[{"type":"text","text":"20"}],"isError":false}}</text>
  <path d="M386 406 L132 406" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="259" y="420" text-anchor="middle" font-size="10.5" fill="#0f172a">"20" → tool_result message → the model reads it</text>
  <rect x="20" y="318" width="100" height="106" rx="6" fill="#16a34a" fill-opacity="0.10"/>
  <text x="70" y="340" text-anchor="middle" font-size="11" font-weight="600" fill="#16a34a">③ a call</text>
  <text x="70" y="356" text-anchor="middle" font-size="10" fill="#64748b">the loop cannot</text>
  <text x="70" y="370" text-anchor="middle" font-size="10" fill="#64748b">tell remote from</text>
  <text x="70" y="384" text-anchor="middle" font-size="10" fill="#64748b">local</text>

  <!-- 4 two kinds of error -->
  <path d="M676 452 L392 452" stroke="#16a34a" stroke-width="1.5" marker-end="url(#al)"/>
  <text x="535" y="446" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace" fill="#0f172a">{"id":5,"result":{"content":[{"type":"text","text":"Error calling calculator: …"}],"isError":true}}</text>
  <text x="535" y="466" text-anchor="middle" font-size="10" fill="#16a34a">tool-level error: a normal result the MODEL reads and recovers from</text>
  <path d="M676 494 L392 494" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ae)"/>
  <text x="535" y="488" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace" fill="#0f172a">{"id":6,"error":{"code":-32602,"message":"Unknown tool: teleport"}}</text>
  <text x="535" y="508" text-anchor="middle" font-size="10" fill="#dc2626">protocol-level error: no result at all; the CLIENT raises (−32601 method not found, −32700 parse error)</text>
  <rect x="20" y="438" width="100" height="74" rx="6" fill="#dc2626" fill-opacity="0.08"/>
  <text x="70" y="460" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">④ two error</text>
  <text x="70" y="476" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">channels</text>
  <text x="450" y="540" text-anchor="middle" font-size="10.5" fill="#64748b">Not implemented here, in the same message style: resources/list, resources/read, prompts/list, prompts/get, sampling, elicitation, tasks (2025-11-25)</text>
</svg>
