<rect x="720" y="90" width="150" height="28" rx="4" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.5"/>
<text x="795" y="109" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="normal" >v_Mia</text>
<rect x="720" y="124" width="150" height="28" rx="4" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.5"/>
<text x="795" y="143" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="normal" >v_had</text>
<rect x="720" y="158" width="150" height="28" rx="4" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.5"/>
