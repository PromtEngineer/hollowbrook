<rect x="720" y="192" width="150" height="28" rx="4" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.5"/>
<text x="795" y="211" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="normal" >v_kite</text>
<text x="795" y="250" font-size="10" fill="#64748b" text-anchor="middle" font-weight="normal" >V: one value vector</text>
<text x="795" y="264" font-size="10" fill="#64748b" text-anchor="middle" font-weight="normal" >per token (1 × d each)</text>
<rect x="20" y="300" width="860" height="60" rx="8" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.5"/>
<text x="450" y="322" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold" >output for 'kite' (row 3) = 0.48·v_Mia + 0.11·v_had + 0.15·v_a + 0.26·v_kite</text>
<text x="450" y="345" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal" >a weighted average of the value vectors of every token it is allowed to see — the weights are the row of step 3</text>
<text x="450" y="395" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="normal" >Q = X·W_q   K = X·W_k   V = X·W_v   are learned projections of the same input rows X (T × d).</text>
<text x="450" y="417" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal" >Score = 'how well does what token i is looking for (q_i) match what token j offers (k_j)'. Dividing by √d keeps scores O(1) so softmax does not saturate.</text>
<text x="450" y="450" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal" >Chapter 5 · numbers are illustrative; the lab prints real ones for T=5, d=8.</text>
</svg>
