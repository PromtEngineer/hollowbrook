<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="system-ui, sans-serif">
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Bradley–Terry: two answers, two scores, one probability</text>

  <!-- prompt -->
  <rect x="20" y="150" width="130" height="60" rx="8" fill="#64748b" fill-opacity="0.12" stroke="#64748b"/>
  <text x="85" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">prompt x</text>
  <text x="85" y="193" text-anchor="middle" font-size="11" fill="#0f172a">"What is 7 + 5?"</text>

  <!-- answer a (chosen) -->
  <rect x="180" y="70" width="150" height="60" rx="8" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a"/>
  <text x="255" y="93" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">answer a (chosen)</text>
  <text x="255" y="113" text-anchor="middle" font-size="12" fill="#0f172a">"7 + 5 = 12"</text>
  <!-- answer b (rejected) -->
  <rect x="180" y="230" width="150" height="60" rx="8" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626"/>
  <text x="255" y="253" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">answer b (rejected)</text>
  <text x="255" y="273" text-anchor="middle" font-size="12" fill="#0f172a">"7 + 5 = 13"</text>

  <line x1="150" y1="170" x2="180" y2="100" stroke="#64748b" stroke-width="1.5"/>
  <line x1="150" y1="190" x2="180" y2="260" stroke="#64748b" stroke-width="1.5"/>

  <!-- reward model boxes -->
  <rect x="360" y="70" width="120" height="60" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb"/>
  <text x="420" y="95" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">reward model</text>
  <text x="420" y="113" text-anchor="middle" font-size="11" fill="#0f172a">r(x, a) = 1.5</text>
  <rect x="360" y="230" width="120" height="60" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb"/>
  <text x="420" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">reward model</text>
  <text x="420" y="273" text-anchor="middle" font-size="11" fill="#0f172a">r(x, b) = −0.5</text>
  <text x="420" y="180" text-anchor="middle" font-size="10" fill="#64748b">same weights, read at the</text>
  <text x="420" y="193" text-anchor="middle" font-size="10" fill="#64748b">last token of each sequence</text>

  <line x1="330" y1="100" x2="360" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="330" y1="260" x2="360" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- difference -->
  <rect x="510" y="150" width="30" height="60" rx="6" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b"/>
  <text x="525" y="186" text-anchor="middle" font-size="18" fill="#0f172a">−</text>
  <line x1="480" y1="100" x2="510" y2="165" stroke="#64748b" stroke-width="1.5"/>
  <line x1="480" y1="260" x2="510" y2="195" stroke="#64748b" stroke-width="1.5"/>
  <text x="525" y="228" text-anchor="middle" font-size="11" fill="#b45309">margin = 2.0</text>

  <!-- sigmoid plot -->
  <g>
    <line x1="560" y1="300" x2="860" y2="300" stroke="#64748b"/>
    <line x1="710" y1="300" x2="710" y2="115" stroke="#64748b" stroke-dasharray="3 3"/>
    <line x1="560" y1="120" x2="860" y2="120" stroke="#64748b" stroke-dasharray="3 3"/>
    <text x="560" y="315" text-anchor="middle" font-size="10" fill="#64748b">−6</text>
    <text x="710" y="315" text-anchor="middle" font-size="10" fill="#64748b">0</text>
    <text x="860" y="315" text-anchor="middle" font-size="10" fill="#64748b">+6</text>
    <text x="710" y="332" text-anchor="middle" font-size="11" fill="#64748b">margin  r(x,a) − r(x,b)</text>
    <text x="552" y="124" text-anchor="end" font-size="10" fill="#64748b">1</text>
    <text x="552" y="304" text-anchor="end" font-size="10" fill="#64748b">0</text>
    <text x="552" y="214" text-anchor="end" font-size="10" fill="#64748b">0.5</text>
    <path d="M560 299.6 L585 299 L610 296.8 L635 291.5 L660 278.6 L685 251.6 L710 210 L735 168.4 L760 141.4 L785 128.5 L810 123.2 L835 121.2 L860 120.4"
          fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <circle cx="760" cy="141.4" r="5" fill="#f59e0b" stroke="#0f172a"/>
    <line x1="760" y1="141.4" x2="760" y2="300" stroke="#f59e0b" stroke-dasharray="3 3"/>
    <text x="768" y="150" font-size="11" fill="#0f172a">σ(2.0) = 0.88</text>
    <text x="710" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#7c3aed">P(a ≻ b) = σ(r(x,a) − r(x,b))</text>
  </g>
  <line x1="540" y1="180" x2="556" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- loss line -->
  <text x="450" y="348" text-anchor="middle" font-size="12" fill="#0f172a">training loss = −log P(a ≻ b) = −log σ(margin); only the difference of the two scores matters</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
