  <line x1="708" y1="62" x2="708" y2="122" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="704" y="132" text-anchor="end" font-size="11" fill="#dc2626">80 % threshold (6,400) → needs_compaction()</text>
  <text x="880" y="132" text-anchor="end" font-size="11" fill="#0f172a">8,000 = window</text>
  <!-- labels -->
  <text x="22" y="150" font-size="11" fill="#0f172a">system (41 tok) + 7 schemas (479 tok) = fixed cost</text>
  <line x1="22" y1="114" x2="24" y2="140" stroke="#94a3b8"/>
    <text x="22" y="164" font-size="11" fill="#0f172a">then the task (9 tok): the first message, never compacted</text>
  <text x="400" y="150" font-size="11" fill="#0f172a">blue = assistant turn with a tool call (~20 tok)   green = tool result (9–508 tok, truncated)</text>
  <text x="400" y="166" font-size="11" fill="#0f172a">the fact "db_port=4242" is the 1st green block (thin: 9 tok, right after the task)</text>

  <!-- window 2: after compaction -->
  <text x="20" y="200" font-size="12" font-weight="600" fill="#0f172a">Same turn after compact(keep_last=6): 2,216 tokens — 19 old tool results became 8-token stubs</text>
