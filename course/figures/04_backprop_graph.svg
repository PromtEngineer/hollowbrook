<text x="68" y="98" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold" >x1</text>
<text x="162" y="98" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal" >data 2</text>
<text x="162" y="118" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="normal" >grad -1.5</text>
<rect x="60" y="160" width="110" height="54" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
<text x="68" y="178" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold" >w1</text>
<text x="162" y="178" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal" >data -3</text>
<text x="162" y="198" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="normal" >grad 1</text>
<rect x="60" y="260" width="110" height="54" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
<text x="68" y="278" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold" >x2</text>
<text x="162" y="278" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal" >data 0</text>
<text x="162" y="298" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="normal" >grad 0.5</text>
<rect x="60" y="340" width="110" height="54" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
<text x="68" y="358" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold" >w2</text>
<text x="162" y="358" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal" >data 1</text>
<text x="162" y="378" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="normal" >grad 0</text>
<rect x="330" y="400" width="110" height="54" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
<text x="338" y="418" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold" >b</text>
<text x="432" y="418" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal" >data 6.8814</text>
<text x="432" y="438" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="normal" >grad 0.5</text>
<rect x="250" y="120" width="110" height="54" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
<text x="258" y="138" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold" >x1w1</text>
<text x="352" y="138" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal" >data -6</text>
<text x="352" y="158" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="normal" >grad 0.5</text>
<rect x="250" y="300" width="110" height="54" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
<text x="258" y="318" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold" >x2w2</text>
<text x="352" y="318" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal" >data 0</text>
<text x="352" y="338" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="normal" >grad 0.5</text>
<rect x="500" y="210" width="110" height="54" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
<text x="508" y="228" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold" >n</text>
<text x="602" y="228" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal" >data 0.8814</text>
<text x="602" y="248" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="normal" >grad 0.5</text>
<rect x="720" y="210" width="110" height="54" rx="8" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.5"/>
<text x="728" y="228" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold" >o</text>
<text x="822" y="228" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal" >data 0.7071</text>
<text x="822" y="248" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="normal" >grad 1</text>
<circle cx="200" cy="147" r="16" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1.5"/>
<text x="200" y="152" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold" >×</text>
<circle cx="200" cy="327" r="16" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1.5"/>
<text x="200" y="332" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold" >×</text>
<circle cx="440" cy="237" r="16" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1.5"/>
<text x="440" y="242" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold" >+</text>
<circle cx="640" cy="237" r="16" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="1.5"/>
<text x="640" y="242" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold" >tanh</text>
<line x1="170" y1="107" x2="186" y2="138" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="170" y1="187" x2="186" y2="156" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="170" y1="287" x2="186" y2="318" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="170" y1="367" x2="186" y2="336" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="216" y1="147" x2="250" y2="147" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="216" y1="327" x2="250" y2="327" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="360" y1="147" x2="428" y2="225" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="360" y1="327" x2="428" y2="249" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="385" y1="427" x2="432" y2="253" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="456" y1="237" x2="500" y2="237" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="610" y1="237" x2="624" y2="237" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="656" y1="237" x2="720" y2="237" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="120" y="100" font-size="10" fill="#64748b" text-anchor="start" font-weight="normal" >∂(x1·w1)/∂x1 = w1 = −3</text>
<text x="120" y="205" font-size="10" fill="#64748b" text-anchor="start" font-weight="normal" >∂(x1·w1)/∂w1 = x1 = 2</text>
<text x="120" y="280" font-size="10" fill="#64748b" text-anchor="start" font-weight="normal" >∂(x2·w2)/∂x2 = w2 = 1</text>
<text x="120" y="385" font-size="10" fill="#64748b" text-anchor="start" font-weight="normal" >∂(x2·w2)/∂w2 = x2 = 0</text>
<text x="372" y="195" font-size="10" fill="#64748b" text-anchor="start" font-weight="normal" >∂n/∂(x1·w1) = 1</text>
<text x="372" y="300" font-size="10" fill="#64748b" text-anchor="start" font-weight="normal" >∂n/∂(x2·w2) = 1</text>
<text x="395" y="445" font-size="10" fill="#64748b" text-anchor="start" font-weight="normal" >∂n/∂b = 1</text>
<text x="640" y="275" font-size="10" fill="#64748b" text-anchor="middle" font-weight="normal" >∂o/∂n = 1 − o² = 0.5</text>
<text x="850" y="237" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="normal" >∂o/∂o = 1</text>
<rect x="560" y="330" width="320" height="110" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.5"/>
<text x="720" y="352" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="bold" >chain rule = multiply the slopes along the path</text>
<text x="575" y="375" font-size="11" fill="#0f172a" text-anchor="start" font-weight="normal" >w1.grad = ∂o/∂n · ∂n/∂(x1·w1) · ∂(x1·w1)/∂w1</text>
<text x="575" y="395" font-size="11" fill="#f59e0b" text-anchor="start" font-weight="normal" >        = 0.5 · 1 · 2 = 1.0</text>
<text x="575" y="415" font-size="11" fill="#f59e0b" text-anchor="start" font-weight="normal" >x1.grad = 0.5 · 1 · (−3) = −1.5      w2.grad = 0.5 · 1 · 0 = 0</text>
<text x="575" y="433" font-size="10" fill="#64748b" text-anchor="start" font-weight="normal" >(a weight that multiplies a zero input gets no gradient)</text>
</svg>
