<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="system-ui, sans-serif" font-size="13">
<rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="450" y="26" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold" >Backpropagation on one neuron:  o = tanh(x1·w1 + x2·w2 + b)</text>
<text x="450" y="46" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal" >blue = value computed forward (left → right)     orange = gradient ∂o/∂node computed backward (right → left)     gray = local slope on each edge</text>
<rect x="40" y="80" width="110" height="54" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
<text x="48" y="98" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold" >x1</text>
<text x="142" y="98" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal" >data 2</text>
<text x="142" y="118" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="normal" >grad -1.5</text>
<rect x="40" y="160" width="110" height="54" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
<text x="48" y="178" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold" >w1</text>
<text x="142" y="178" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal" >data -3</text>
<text x="142" y="198" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="normal" >grad 1</text>
<rect x="40" y="260" width="110" height="54" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
<text x="48" y="278" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold" >x2</text>
<text x="142" y="278" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal" >data 0</text>
<text x="142" y="298" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="normal" >grad 0.5</text>
<rect x="40" y="340" width="110" height="54" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
<text x="48" y="358" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold" >w2</text>
<text x="142" y="358" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal" >data 1</text>
<text x="142" y="378" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="normal" >grad 0</text>
<rect x="300" y="400" width="110" height="54" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
<text x="308" y="418" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold" >b</text>
<text x="402" y="418" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal" >data 6.8814</text>
<text x="402" y="438" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="normal" >grad 0.5</text>
<rect x="300" y="120" width="110" height="54" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
<text x="308" y="138" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold" >x1w1</text>
<text x="402" y="138" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal" >data -6</text>
<text x="402" y="158" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="normal" >grad 0.5</text>
<rect x="300" y="300" width="110" height="54" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
<text x="308" y="318" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold" >x2w2</text>
<text x="402" y="318" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal" >data 0</text>
<text x="402" y="338" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="normal" >grad 0.5</text>
<rect x="500" y="210" width="110" height="54" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
<text x="508" y="228" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold" >n</text>
<text x="602" y="228" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal" >data 0.8814</text>
<text x="602" y="248" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="normal" >grad 0.5</text>
<rect x="700" y="210" width="110" height="54" rx="8" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.5"/>
<text x="708" y="228" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold" >o</text>
<text x="802" y="228" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal" >data 0.7071</text>
<text x="802" y="248" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="normal" >grad 1</text>
<circle cx="240" cy="147" r="16" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1.5"/>
<text x="240" y="152" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold" >×</text>
<circle cx="240" cy="327" r="16" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1.5"/>
<text x="240" y="332" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold" >×</text>
<circle cx="450" cy="237" r="16" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1.5"/>
<text x="450" y="242" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold" >+</text>
<circle cx="630" cy="237" r="16" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="1.5"/>
<text x="630" y="242" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold" >tanh</text>
<line x1="150" y1="107" x2="226" y2="139" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="150" y1="187" x2="226" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="150" y1="287" x2="226" y2="319" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="150" y1="367" x2="226" y2="335" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="256" y1="147" x2="300" y2="147" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="256" y1="327" x2="300" y2="327" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="410" y1="147" x2="438" y2="226" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="410" y1="327" x2="438" y2="248" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="410" y1="402" x2="452" y2="254" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="466" y1="237" x2="500" y2="237" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="610" y1="237" x2="614" y2="237" stroke="#64748b" stroke-width="1.5"/>
<line x1="646" y1="237" x2="700" y2="237" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="155" y="92" font-size="10" fill="#64748b" text-anchor="start" font-weight="normal" >∂(x1·w1)/∂x1 = w1 = −3</text>
<text x="155" y="205" font-size="10" fill="#64748b" text-anchor="start" font-weight="normal" >∂(x1·w1)/∂w1 = x1 = 2</text>
<text x="155" y="272" font-size="10" fill="#64748b" text-anchor="start" font-weight="normal" >∂(x2·w2)/∂x2 = w2 = 1</text>
<text x="155" y="385" font-size="10" fill="#64748b" text-anchor="start" font-weight="normal" >∂(x2·w2)/∂w2 = x2 = 0</text>
<text x="420" y="190" font-size="10" fill="#64748b" text-anchor="end" font-weight="normal" >∂n/∂(x1·w1) = 1</text>
<text x="432" y="292" font-size="10" fill="#64748b" text-anchor="start" font-weight="normal" >∂n/∂(x2·w2) = 1</text>
<text x="420" y="370" font-size="10" fill="#64748b" text-anchor="end" font-weight="normal" >∂n/∂b = 1</text>
<text x="630" y="275" font-size="10" fill="#64748b" text-anchor="middle" font-weight="normal" >∂o/∂n = 1 − o² = 0.5</text>
<text x="815" y="237" font-size="10" fill="#f59e0b" text-anchor="start" font-weight="normal" >∂o/∂o = 1</text>
<rect x="560" y="320" width="320" height="135" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.5"/>
<text x="720" y="342" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="bold" >chain rule = multiply the slopes along the path</text>
<text x="575" y="365" font-size="11" fill="#0f172a" text-anchor="start" font-weight="normal" >w1.grad = ∂o/∂n · ∂n/∂(x1·w1) · ∂(x1·w1)/∂w1</text>
<text x="575" y="385" font-size="11" fill="#f59e0b" text-anchor="start" font-weight="normal" >        = 0.5 · 1 · 2 = 1.0</text>
<text x="575" y="405" font-size="11" fill="#f59e0b" text-anchor="start" font-weight="normal" >x1.grad = 0.5 · 1 · (−3) = −1.5</text>
<text x="575" y="425" font-size="11" fill="#f59e0b" text-anchor="start" font-weight="normal" >w2.grad = 0.5 · 1 · 0 = 0</text>
<text x="575" y="445" font-size="10" fill="#64748b" text-anchor="start" font-weight="normal" >(a weight that multiplies a zero input gets no gradient)</text>
</svg>
