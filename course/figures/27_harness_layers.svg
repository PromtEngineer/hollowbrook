<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">The layers of a coding-agent harness — what each one prevents</text>
  <text x="450" y="46" text-anchor="middle" font-size="12" fill="#64748b">one turn flows left to right; the model is the only part that is not code you control</text>

  <!-- human -->
  <rect x="20" y="230" width="90" height="60" rx="10" fill="#64748b" fill-opacity="0.12" stroke="#64748b" stroke-width="1.5"/>
  <text x="65" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">human</text>
  <text x="65" y="273" text-anchor="middle" font-size="10" fill="#64748b">task · approvals</text>

  <!-- model -->
  <rect x="140" y="215" width="120" height="90" rx="10" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="200" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">model</text>
  <text x="200" y="262" text-anchor="middle" font-size="10" fill="#64748b">Backend.complete</text>
  <text x="200" y="280" text-anchor="middle" font-size="10" fill="#7c3aed">proposes: text + tool calls</text>
  <text x="200" y="295" text-anchor="middle" font-size="9.5" fill="#dc2626">a claim, not a fact</text>

  <!-- loop -->
  <rect x="290" y="215" width="120" height="90" rx="10" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
  <text x="350" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">loop</text>
  <text x="350" y="262" text-anchor="middle" font-size="10" fill="#64748b">Agent.run</text>
  <text x="350" y="280" text-anchor="middle" font-size="10" fill="#2563eb">think → act → observe</text>
  <text x="350" y="295" text-anchor="middle" font-size="9.5" fill="#64748b">stops: no call / max_turns</text>

  <!-- gate + hooks (stacked) -->
  <rect x="440" y="180" width="130" height="70" rx="10" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="505" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">pre-tool hooks</text>
  <text x="505" y="219" text-anchor="middle" font-size="10" fill="#64748b">Hooks.pre_tool</text>
  <text x="505" y="236" text-anchor="middle" font-size="9.5" fill="#f59e0b">block: "PLAN.md is read-only"</text>

  <rect x="440" y="262" width="130" height="70" rx="10" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="505" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">permission gate</text>
  <text x="505" y="301" text-anchor="middle" font-size="10" fill="#64748b">Agent._permitted</text>
  <text x="505" y="318" text-anchor="middle" font-size="9.5" fill="#f59e0b">allow_all · read_only · ask</text>

  <!-- tools + sandbox -->
  <rect x="595" y="215" width="140" height="90" rx="10" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.5"/>
  <text x="665" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">tools + sandbox</text>
  <text x="665" y="262" text-anchor="middle" font-size="10" fill="#64748b">ToolRegistry.call</text>
  <text x="665" y="280" text-anchor="middle" font-size="9" fill="#16a34a">never raises; paths stay in</text>
  <text x="665" y="295" text-anchor="middle" font-size="9.5" fill="#64748b">errors come back as text</text>

  <!-- post hooks -->
  <rect x="760" y="215" width="120" height="90" rx="10" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="820" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">post-tool hooks</text>
  <text x="820" y="262" text-anchor="middle" font-size="10" fill="#64748b">Hooks.post_tool</text>
  <text x="820" y="280" text-anchor="middle" font-size="10" fill="#f59e0b">truncate · redact · log</text>
  <text x="820" y="295" text-anchor="middle" font-size="9.5" fill="#64748b">→ harness.log</text>

  <!-- arrows along the turn -->
  <line x1="110" y1="260" x2="138" y2="260" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="260" y1="260" x2="288" y2="260" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="410" y1="245" x2="438" y2="220" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="505" y1="250" x2="505" y2="260" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="570" y1="290" x2="598" y2="268" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="730" y1="260" x2="758" y2="260" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- observe: result back to the loop -->
  <path d="M 820 305 L 820 345 L 350 345 L 350 307" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="585" y="340" text-anchor="middle" font-size="10" fill="#2563eb">tool_result appended to the context (observe)</text>

  <!-- context budget above the loop -->
  <rect x="290" y="95" width="120" height="60" rx="10" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
  <text x="350" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">context budget</text>
  <text x="350" y="134" text-anchor="middle" font-size="10" fill="#64748b">compact at 80 %</text>
  <text x="350" y="148" text-anchor="middle" font-size="9.5" fill="#2563eb">prevents overflow</text>
  <line x1="350" y1="155" x2="350" y2="213" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- sub-agents above the model -->
  <rect x="125" y="95" width="150" height="60" rx="10" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="200" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">sub-agents</text>
  <text x="200" y="134" text-anchor="middle" font-size="10" fill="#64748b">run_subagent</text>
  <text x="200" y="148" text-anchor="middle" font-size="9" fill="#7c3aed">fresh context, one paragraph back</text>
  <line x1="200" y1="155" x2="200" y2="213" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- files below -->
  <rect x="120" y="390" width="310" height="70" rx="10" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.5"/>
  <text x="275" y="413" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">plan &amp; progress files</text>
  <text x="275" y="430" text-anchor="middle" font-size="9.5" fill="#64748b">PLAN.md · PROGRESS.md · MEMORY.md · harness.log</text>
  <text x="275" y="447" text-anchor="middle" font-size="9.5" fill="#16a34a">state outside the window: survives compaction and crashes</text>
  <path d="M 275 388 L 275 360 L 320 360 L 320 307" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="212" y="372" font-size="9.5" fill="#64748b">read every session</text>

  <!-- verifier below tools -->
  <rect x="590" y="390" width="230" height="70" rx="10" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="1.5"/>
  <text x="705" y="413" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">verifier</text>
  <text x="700" y="430" text-anchor="middle" font-size="10" fill="#64748b">MiniHarness.verify → run_tests</text>
  <text x="705" y="447" text-anchor="middle" font-size="8.5" fill="#dc2626">the harness runs it, not the model: "done" needs evidence</text>
  <path d="M 665 307 L 665 388" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowred)"/>
  <text x="680" y="352" font-size="9.5" fill="#dc2626">after each session</text>
  <path d="M 598 440 L 412 440" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowred)"/>
  <text x="510" y="428" text-anchor="middle" font-size="8.5" fill="#dc2626">PASS / FAIL + pytest tail → PROGRESS.md</text>

  <!-- legend -->
  <text x="20" y="497" font-size="10.5" fill="#64748b">purple = the model and its copies · blue = the loop and its budget · orange = the owner's rules · green = things that touch the world · red = ground truth</text>
  <text x="20" y="512" font-size="10.5" fill="#64748b">solid arrows: the request path of one turn · dashed: side channels (files, memory, child agents)</text>
</svg>
