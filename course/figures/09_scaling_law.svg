<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Iso-FLOP curves and the compute-optimal frontier (schematic, after Chinchilla 2022)</text>

  <!-- LEFT PANEL: iso-FLOP curves -->
  <g transform="translate(60,60)">
    <text x="190" y="0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Fix compute C, vary the split between N and D</text>
    <line x1="40" y1="330" x2="380" y2="330" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="40" y1="330" x2="40" y2="30" stroke="#0f172a" stroke-width="1.5"/>
    <text x="210" y="360" text-anchor="middle" font-size="12" fill="#0f172a">parameters N (log scale) →   (D = C / 6N shrinks as N grows)</text>
    <text x="-180" y="20" transform="rotate(-90)" text-anchor="middle" font-size="12" fill="#0f172a">validation loss L  (lower is better)</text>
    <!-- iso-FLOP curves: small budget is high; each 10x budget sits lower and its minimum moves right -->
    <path d="M55 120 C 100 95, 125 90, 150 100 C 190 120, 230 190, 290 300" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <path d="M70 230 C 120 175, 170 150, 215 160 C 260 175, 300 230, 350 300" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <path d="M110 300 C 170 240, 230 205, 275 210 C 320 218, 350 250, 378 290" fill="none" stroke="#16a34a" stroke-width="2.5"/>
    <text x="48" y="112" font-size="11" fill="#2563eb">C</text>
    <text x="58" y="222" font-size="11" fill="#f59e0b">10 C</text>
    <text x="96" y="296" font-size="11" fill="#16a34a">100 C</text>
    <!-- minima -->
    <circle cx="140" cy="97" r="5" fill="#2563eb"/>
    <circle cx="210" cy="158" r="5" fill="#f59e0b"/>
    <circle cx="272" cy="209" r="5" fill="#16a34a"/>
    <!-- frontier -->
    <path d="M120 80 L 300 240" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="215" y="80" font-size="11" fill="#7c3aed">compute-optimal frontier: N* ∝ C^0.5</text>
    <!-- annotations -->
    <text x="60" y="160" font-size="10" fill="#64748b">too small a model:</text>
    <text x="60" y="172" font-size="10" fill="#64748b">many tokens, little capacity</text>
    <text x="255" y="300" font-size="10" fill="#64748b">too big a model:</text>
    <text x="255" y="312" font-size="10" fill="#64748b">few tokens, undertrained</text>
  </g>

  <!-- RIGHT PANEL: tokens per parameter -->
  <g transform="translate(500,60)">
    <text x="190" y="0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Where 2026 runs sit: tokens per parameter (D / N)</text>
    <line x1="40" y1="330" x2="380" y2="330" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="40" y1="330" x2="40" y2="30" stroke="#0f172a" stroke-width="1.5"/>
    <text x="210" y="360" text-anchor="middle" font-size="12" fill="#0f172a">training tokens D (log scale) →</text>
    <text x="-180" y="20" transform="rotate(-90)" text-anchor="middle" font-size="12" fill="#0f172a">parameters N (log scale)</text>
    <!-- Chinchilla line D = 20 N -->
    <line x1="60" y1="300" x2="330" y2="60" stroke="#7c3aed" stroke-width="2"/>
    <text x="332" y="52" text-anchor="end" font-size="11" fill="#7c3aed">D = 20 N (Chinchilla-optimal for training cost)</text>
    <!-- Overtrained region: to the right/below -->
    <line x1="150" y1="320" x2="380" y2="115" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="205" y="304" font-size="11" fill="#16a34a">D ≈ 200–2000 N: "overtrained"</text>
    <text x="205" y="318" font-size="11" fill="#16a34a">(cheaper to serve, same quality)</text>
    <!-- points -->
    <circle cx="170" cy="200" r="5" fill="#7c3aed"/>
    <text x="178" y="196" font-size="10" fill="#0f172a">Chinchilla 70B / 1.4T (20 : 1)</text>
    <circle cx="255" cy="255" r="5" fill="#16a34a"/>
    <text x="150" y="288" font-size="10" fill="#0f172a">Llama-3 8B / 15T (≈1900 : 1)</text>
    <circle cx="230" cy="140" r="5" fill="#f59e0b"/>
    <text x="222" y="136" text-anchor="end" font-size="10" fill="#0f172a">nanochat d20 ≈ 0.56B / 11B (20 : 1)</text>
    <circle cx="75" cy="315" r="5" fill="#2563eb"/>
    <text x="83" y="318" font-size="10" fill="#0f172a">TinyLM small 2.4M / 2.9M (≈1 : 1)</text>
    <text x="45" y="50" font-size="10" fill="#64748b">Left of the purple line = wasting compute on parameters;</text>
    <text x="45" y="62" font-size="10" fill="#64748b">right of it = paying extra training FLOPs to save inference FLOPs.</text>
  </g>

  <text x="450" y="495" text-anchor="middle" font-size="12" fill="#64748b">Left: each curve is one budget C = 6·N·D; its minimum is the best model for that budget and the minima line up on a power law.</text>
  <text x="450" y="511" text-anchor="middle" font-size="12" fill="#64748b">Right: axes are schematic, not to scale; the ratio D/N is what to read.</text>
</svg>
