<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="system-ui, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">PPO's clipped objective: once a token's probability has moved by ε, the gradient becomes zero</text>

  <!-- ===== left panel: A > 0 ===== -->
  <g>
    <text x="240" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#16a34a">advantage A = +1 (a token of a good answer)</text>
    <!-- axes: x 0.4..1.6 -> px 70..410 (283.3 px per unit); y 0..1.6 -> 320..120 (125 px/unit) -->
    <line x1="70" y1="320" x2="410" y2="320" stroke="#64748b"/>
    <line x1="70" y1="320" x2="70" y2="110" stroke="#64748b"/>
    <text x="410" y="338" text-anchor="end" font-size="11" fill="#64748b">ratio ρ = π_θ(a) / π_old(a)</text>
    <text x="60" y="118" text-anchor="end" font-size="11" fill="#64748b">objective</text>
    <!-- ticks -->
    <line x1="183" y1="320" x2="183" y2="325" stroke="#64748b"/><text x="183" y="338" text-anchor="middle" font-size="10" fill="#64748b">0.8</text>
    <line x1="240" y1="320" x2="240" y2="325" stroke="#64748b"/><text x="240" y="338" text-anchor="middle" font-size="10" fill="#64748b">1.0</text>
    <line x1="297" y1="320" x2="297" y2="325" stroke="#64748b"/><text x="297" y="338" text-anchor="middle" font-size="10" fill="#64748b">1.2</text>
    <!-- shaded clipped zone -->
    <rect x="297" y="110" width="113" height="210" fill="#dc2626" fill-opacity="0.08"/>
    <text x="353" y="130" text-anchor="middle" font-size="10" fill="#dc2626">clipped: gradient = 0</text>
    <!-- unclipped ρ·A dashed line: y = 320 - ρ*125; ρ=0.4 -> 270; ρ=1.6 -> 120 -->
    <line x1="70" y1="270" x2="410" y2="120" stroke="#64748b" stroke-dasharray="4 3"/>
    <text x="392" y="112" text-anchor="end" font-size="10" fill="#64748b">ρ·A (unclipped)</text>
    <!-- clipped objective: min(ρ, 1.2) -> rises to ρ=1.2 (y=170) then flat -->
    <path d="M70 270 L297 170 L410 170" fill="none" stroke="#16a34a" stroke-width="3"/>
    <circle cx="240" cy="195" r="4" fill="#0f172a"/>
    <text x="232" y="212" text-anchor="end" font-size="10" fill="#0f172a">start: ρ = 1</text>
    <text x="150" y="240" font-size="10" fill="#16a34a">slope A: push probability up…</text>
    <text x="300" y="160" font-size="10" fill="#16a34a">…until 1 + ε_high, then stop</text>
    <!-- below 0.8: min picks ρ·A which is smaller -> still gradient -->
    <text x="75" y="300" font-size="10" fill="#64748b">below 1 − ε the min() keeps ρ·A:</text>
    <text x="75" y="313" font-size="10" fill="#64748b">still a gradient (a good token that fell can recover)</text>
  </g>

  <!-- ===== right panel: A < 0 ===== -->
  <g>
    <text x="660" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">advantage A = −1 (a token of a bad answer)</text>
    <!-- axes: x 0.4..1.6 -> px 490..830; y -1.6..0 -> 320..120 -->
    <line x1="490" y1="120" x2="830" y2="120" stroke="#64748b"/>
    <line x1="490" y1="120" x2="490" y2="330" stroke="#64748b"/>
    <text x="830" y="338" text-anchor="end" font-size="11" fill="#64748b">ratio ρ = π_θ(a) / π_old(a)</text>
    <text x="480" y="128" text-anchor="end" font-size="11" fill="#64748b">0</text>
    <text x="480" y="318" text-anchor="end" font-size="11" fill="#64748b">objective</text>
    <line x1="603" y1="120" x2="603" y2="115" stroke="#64748b"/><text x="603" y="110" text-anchor="middle" font-size="10" fill="#64748b">0.8</text>
    <line x1="660" y1="120" x2="660" y2="115" stroke="#64748b"/><text x="660" y="110" text-anchor="middle" font-size="10" fill="#64748b">1.0</text>
    <line x1="717" y1="120" x2="717" y2="115" stroke="#64748b"/><text x="717" y="110" text-anchor="middle" font-size="10" fill="#64748b">1.2</text>
    <!-- clipped zone: ρ < 0.8 -->
    <rect x="490" y="120" width="113" height="210" fill="#dc2626" fill-opacity="0.08"/>
    <text x="546" y="300" text-anchor="middle" font-size="10" fill="#dc2626">clipped: gradient = 0</text>
    <!-- unclipped -ρ: y = 120 + ρ*125; ρ=0.4 -> 170; ρ=1.6 -> 320 -->
    <line x1="490" y1="170" x2="830" y2="320" stroke="#64748b" stroke-dasharray="4 3"/>
    <text x="828" y="335" text-anchor="end" font-size="10" fill="#64748b">ρ·A (unclipped)</text>
    <!-- clipped objective: min(-ρ, -clip(ρ)) = -max(ρ, clip) -> flat at -0.8 (y=220) for ρ<0.8, then -ρ -->
    <path d="M490 220 L603 220 L830 320" fill="none" stroke="#dc2626" stroke-width="3"/>
    <circle cx="660" cy="245" r="4" fill="#0f172a"/>
    <text x="668" y="240" font-size="10" fill="#0f172a">start: ρ = 1</text>
    <text x="700" y="290" font-size="10" fill="#dc2626">push probability down…</text>
    <text x="500" y="210" font-size="10" fill="#dc2626">…until 1 − ε_low, then stop</text>
    <text x="620" y="180" font-size="10" fill="#64748b">above 1 + ε the min() keeps ρ·A: a bad token</text>
    <text x="620" y="193" font-size="10" fill="#64748b">that somehow grew is still pushed down</text>
  </g>

  <!-- footer -->
  <rect x="30" y="352" width="840" height="40" rx="8" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb"/>
  <text x="450" y="370" text-anchor="middle" font-size="12" fill="#0f172a">L_t = −min( ρ_t·A,  clip(ρ_t, 1 − ε_low, 1 + ε_high)·A )   —   ppo_clip_loss in llm/rl.py; DAPO's clip-higher sets ε_high (0.28) &gt; ε_low (0.2)</text>
  <text x="450" y="386" text-anchor="middle" font-size="10" fill="#64748b">the pessimistic min() means clipping only ever removes an incentive to move further in the direction the advantage already wants; it never blocks a correction</text>
</svg>
