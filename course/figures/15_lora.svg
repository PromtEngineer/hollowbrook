<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="system-ui, sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">LoRA: a frozen weight plus a trainable low-rank detour</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#64748b">y = W x + (B A x) · α/r   ·   shown for TinyLM-small's q_proj: d_in = d_out = 192, rank r = 8</text>

  <!-- input x -->
  <rect x="30" y="170" width="34" height="90" rx="6" fill="#64748b" fill-opacity="0.12" stroke="#64748b"/>
  <text x="47" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">x</text>
  <text x="47" y="278" text-anchor="middle" font-size="10" fill="#64748b">(d_in,)</text>

  <!-- frozen W path -->
  <line x1="64" y1="200" x2="150" y2="140" stroke="#0f172a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="152" y="80" width="130" height="130" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="217" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">W</text>
  <text x="217" y="160" text-anchor="middle" font-size="11" fill="#0f172a">192 × 192</text>
  <text x="217" y="176" text-anchor="middle" font-size="11" fill="#0f172a">36,864 numbers</text>
  <text x="217" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">frozen (requires_grad=False)</text>
  <text x="217" y="70" text-anchor="middle" font-size="11" fill="#64748b">the pretrained weight</text>

  <!-- LoRA path -->
  <line x1="64" y1="230" x2="150" y2="300" stroke="#0f172a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="152" y="280" width="130" height="40" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="2"/>
  <text x="217" y="298" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">A</text>
  <text x="217" y="313" text-anchor="middle" font-size="9" fill="#0f172a">r × d_in = 8×192 = 1,536</text>
  <line x1="282" y1="300" x2="312" y2="300" stroke="#0f172a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="300" y="292" text-anchor="middle" font-size="9" fill="#64748b">(r,)</text>
  <rect x="314" y="240" width="52" height="120" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="2"/>
  <text x="340" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">B</text>
  <text x="340" y="312" text-anchor="middle" font-size="8" fill="#0f172a">d_out × r</text>
  <text x="340" y="324" text-anchor="middle" font-size="8" fill="#0f172a">192 × 8</text>
  <text x="340" y="336" text-anchor="middle" font-size="8" fill="#0f172a">= 1,536</text>
  <text x="340" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="#f59e0b">trainable: 3,072 numbers (8.3% of W)</text>
  <text x="340" y="392" text-anchor="middle" font-size="10" fill="#64748b">B starts at zero, so at step 0 the layer computes exactly W x</text>

  <!-- scale and sum -->
  <line x1="366" y1="300" x2="420" y2="300" stroke="#0f172a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="392" y="292" text-anchor="middle" font-size="11" fill="#0f172a">× α/r = 2</text>
  <line x1="282" y1="145" x2="420" y2="145" stroke="#0f172a" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="445" cy="222" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="445" y="228" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">+</text>
  <line x1="430" y1="145" x2="440" y2="203" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="430" y1="300" x2="440" y2="241" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="463" y1="222" x2="500" y2="222" stroke="#0f172a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="502" y="177" width="34" height="90" rx="6" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a"/>
  <text x="519" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">y</text>
  <text x="519" y="285" text-anchor="middle" font-size="10" fill="#64748b">(d_out,)</text>
  <defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#0f172a"/></marker></defs>

  <!-- right panel: merge + counts -->
  <g font-size="11" fill="#0f172a">
    <rect x="570" y="70" width="310" height="150" rx="8" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-opacity="0.5"/>
    <text x="584" y="92" font-weight="700">merge_lora(): fold the detour back in</text>
    <text x="584" y="112" font-family="ui-monospace, monospace">W' = W + (α/r) · B @ A</text>
    <text x="584" y="130">B @ A is 192 × 192, the same shape as W, so after</text>
    <text x="584" y="146">training the adapter is added into the weight, the</text>
    <text x="584" y="162">plain nn.Linear is put back. Inference cost: the same</text>
    <text x="584" y="178">as the original model; parameter names match the</text>
    <text x="584" y="194">base, so TinyLM.save / load just work.</text>
    <text x="584" y="211" fill="#64748b">llm/sft.py: LoRALinear.merged_weight, merge_lora</text>

    <rect x="570" y="236" width="310" height="170" rx="8" fill="#64748b" fill-opacity="0.06" stroke="#64748b" stroke-opacity="0.4"/>
    <text x="584" y="258" font-weight="700">Where the adapters go (LORA_TARGETS)</text>
    <text x="584" y="276" font-size="10">q_proj, v_proj, o_proj, gate_proj, up_proj, down_proj</text>
    <text x="584" y="292">in every block. k_proj is left alone (Hu et al. 2021</text>
    <text x="584" y="308">found q and v matter most; adding the MLP helps).</text>
    <text x="584" y="330" font-weight="700">Why it is cheap</text>
    <text x="584" y="348">Trainable numbers per layer: r · (d_in + d_out)</text>
    <text x="584" y="364">instead of d_in · d_out. Optimizer state (Adam keeps</text>
    <text x="584" y="380">two extra copies per parameter) shrinks by the same</text>
    <text x="584" y="396">factor: it is what lets a 70B model tune on 1 GPU.</text>
  </g>
</svg>
