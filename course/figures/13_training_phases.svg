<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="system-ui, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Where mid-training sits: the learning-rate curve and the data mix across a 2026 training run</text>

  <!-- axes -->
  <line x1="60" y1="190" x2="860" y2="190" stroke="#64748b"/>
  <line x1="60" y1="60" x2="60" y2="190" stroke="#64748b"/>
  <text x="40" y="66" text-anchor="end" font-size="11" fill="#64748b">LR</text>
  <text x="860" y="205" text-anchor="end" font-size="11" fill="#64748b">tokens seen →</text>

  <!-- phase bands -->
  <rect x="60" y="60" width="440" height="130" fill="#2563eb" fill-opacity="0.08"/>
  <rect x="500" y="60" width="150" height="130" fill="#f59e0b" fill-opacity="0.12"/>
  <rect x="650" y="60" width="90" height="130" fill="#16a34a" fill-opacity="0.12"/>
  <rect x="740" y="60" width="120" height="130" fill="#7c3aed" fill-opacity="0.10"/>

  <!-- LR curve: warmup, stable, decay, low constant, small bumps in post-training -->
  <path d="M60 188 L90 80 L500 80 L650 178 L740 178 L745 150 L800 150 L805 170 L860 170"
        fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="290" y="72" text-anchor="middle" font-size="11" fill="#dc2626">stable (WSD plateau)</text>
  <text x="575" y="112" text-anchor="middle" font-size="11" fill="#dc2626">linear decay → 0</text>
  <text x="695" y="170" text-anchor="middle" font-size="10" fill="#dc2626">low LR</text>
  <text x="800" y="140" text-anchor="middle" font-size="10" fill="#dc2626">SFT / RL LRs</text>
  <!-- branch point marker -->
  <circle cx="500" cy="80" r="5" fill="#f59e0b" stroke="#0f172a"/>
  <text x="500" y="52" text-anchor="middle" font-size="10" fill="#b45309">branch point: any stable checkpoint can be annealed</text>

  <!-- phase labels -->
  <g font-size="13" font-weight="600">
    <text x="280" y="225" text-anchor="middle" fill="#2563eb">1. pretraining</text>
    <text x="575" y="225" text-anchor="middle" fill="#b45309">2. anneal</text>
    <text x="695" y="225" text-anchor="middle" fill="#16a34a">3. long-context</text>
    <text x="800" y="225" text-anchor="middle" fill="#7c3aed">4. post-training</text>
  </g>
  <g font-size="10" fill="#64748b">
    <text x="280" y="241" text-anchor="middle">~90–95% of tokens</text>
    <text x="575" y="241" text-anchor="middle">last ~5–10%</text>
    <text x="695" y="241" text-anchor="middle">~0.1–1%</text>
    <text x="800" y="241" text-anchor="middle">Chapters 14–22</text>
  </g>
  <rect x="490" y="215" width="260" height="34" rx="6" fill="none" stroke="#f59e0b" stroke-dasharray="5 3"/>
  <text x="620" y="262" text-anchor="middle" font-size="11" fill="#b45309">← "mid-training" (2025–26 vocabulary) →</text>

  <!-- data mix bars -->
  <text x="40" y="300" text-anchor="end" font-size="11" fill="#64748b">data mix</text>
  <!-- pretraining mix -->
  <rect x="60" y="285" width="440" height="24" fill="#64748b" fill-opacity="0.25"/>
  <rect x="60" y="285" width="330" height="24" fill="#2563eb" fill-opacity="0.35"/>
  <text x="225" y="301" text-anchor="middle" font-size="10" fill="#0f172a">filtered web (diverse)</text>
  <text x="445" y="301" text-anchor="middle" font-size="10" fill="#0f172a">code · math</text>
  <!-- anneal mix -->
  <rect x="500" y="285" width="150" height="24" fill="#f59e0b" fill-opacity="0.35"/>
  <rect x="500" y="285" width="45" height="24" fill="#64748b" fill-opacity="0.25"/>
  <text x="522" y="301" text-anchor="middle" font-size="9" fill="#0f172a">replay</text>
  <text x="598" y="301" text-anchor="middle" font-size="9" fill="#0f172a">high-quality, math, code,</text>
  <text x="598" y="320" text-anchor="middle" font-size="9" fill="#b45309">instruction &amp; reasoning data</text>
  <!-- long context mix -->
  <rect x="650" y="285" width="90" height="24" fill="#16a34a" fill-opacity="0.35"/>
  <text x="695" y="301" text-anchor="middle" font-size="9" fill="#0f172a">long docs</text>
  <text x="695" y="320" text-anchor="middle" font-size="9" fill="#16a34a">RoPE θ ↑, seq 8k→128k+</text>
  <!-- post -->
  <rect x="740" y="285" width="120" height="24" fill="#7c3aed" fill-opacity="0.3"/>
  <text x="800" y="301" text-anchor="middle" font-size="9" fill="#0f172a">chats, prefs, RL</text>

  <!-- checkpoints -->
  <g font-size="10" fill="#0f172a">
    <rect x="455" y="340" width="90" height="26" rx="5" fill="#ffffff" stroke="#2563eb"/><text x="500" y="357" text-anchor="middle">stable ckpt</text>
    <rect x="605" y="340" width="90" height="26" rx="5" fill="#ffffff" stroke="#f59e0b"/><text x="650" y="357" text-anchor="middle">annealed ckpt</text>
    <rect x="700" y="340" width="90" height="26" rx="5" fill="#ffffff" stroke="#16a34a"/><text x="745" y="357" text-anchor="middle">"base" release</text>
  </g>
  <text x="450" y="390" text-anchor="middle" font-size="10" fill="#64748b">the base checkpoint is a product: it is what everyone fine-tunes, distils from, and benchmarks against</text>
</svg>
