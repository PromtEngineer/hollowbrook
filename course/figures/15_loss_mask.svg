<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="system-ui, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">The SFT loss: next-token prediction shifted by one, then masked to assistant tokens</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#64748b">a shortened example: &lt;|user|&gt;Write in capitals: kite&lt;|end|&gt;&lt;|assistant|&gt;KITE&lt;|end|&gt;  (system turn omitted to fit)</text>

  <!-- column positions -->
  <g font-size="11" fill="#64748b">
    <text x="60" y="84" font-weight="700">position t</text>
    <text x="150" y="84" text-anchor="middle">0</text><text x="220" y="84" text-anchor="middle">1</text><text x="290" y="84" text-anchor="middle">2</text><text x="360" y="84" text-anchor="middle">3</text><text x="430" y="84" text-anchor="middle">4</text><text x="500" y="84" text-anchor="middle">5</text><text x="570" y="84" text-anchor="middle">6</text><text x="640" y="84" text-anchor="middle">7</text><text x="710" y="84" text-anchor="middle">8</text><text x="780" y="84" text-anchor="middle">9</text><text x="850" y="84" text-anchor="middle">10</text>
  </g>

  <!-- row: ids -->
  <text x="20" y="118" font-size="12" font-weight="700" fill="#0f172a">ids</text>
  <g font-size="10" font-family="ui-monospace, monospace" fill="#0f172a">
    <rect x="120" y="98" width="60" height="30" rx="5" fill="#64748b" fill-opacity="0.12" stroke="#64748b"/><text x="150" y="117" text-anchor="middle">&lt;|bos|&gt;</text>
    <rect x="190" y="98" width="60" height="30" rx="5" fill="#64748b" fill-opacity="0.12" stroke="#64748b"/><text x="220" y="117" text-anchor="middle">&lt;|user|&gt;</text>
    <rect x="260" y="98" width="60" height="30" rx="5" fill="#64748b" fill-opacity="0.12" stroke="#64748b"/><text x="290" y="117" text-anchor="middle">Write…</text>
    <rect x="330" y="98" width="60" height="30" rx="5" fill="#64748b" fill-opacity="0.12" stroke="#64748b"/><text x="360" y="117" text-anchor="middle">␣kite</text>
    <rect x="400" y="98" width="60" height="30" rx="5" fill="#64748b" fill-opacity="0.12" stroke="#64748b"/><text x="430" y="117" text-anchor="middle">&lt;|end|&gt;</text>
    <rect x="470" y="98" width="60" height="30" rx="5" fill="#64748b" fill-opacity="0.12" stroke="#64748b"/><text x="500" y="117" text-anchor="middle">&lt;|asst|&gt;</text>
    <rect x="540" y="98" width="60" height="30" rx="5" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="2"/><text x="570" y="117" text-anchor="middle" font-weight="700">K</text>
    <rect x="610" y="98" width="60" height="30" rx="5" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="2"/><text x="640" y="117" text-anchor="middle" font-weight="700">I</text>
    <rect x="680" y="98" width="60" height="30" rx="5" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="2"/><text x="710" y="117" text-anchor="middle" font-weight="700">T</text>
    <rect x="750" y="98" width="60" height="30" rx="5" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="2"/><text x="780" y="117" text-anchor="middle" font-weight="700">E</text>
    <rect x="820" y="98" width="60" height="30" rx="5" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="2"/><text x="850" y="117" text-anchor="middle" font-weight="700">&lt;|end|&gt;</text>
  </g>
  <text x="20" y="150" font-size="12" font-weight="700" fill="#0f172a">mask</text>
  <g font-size="12" font-family="ui-monospace, monospace">
    <text x="150" y="150" text-anchor="middle" fill="#64748b">0</text><text x="220" y="150" text-anchor="middle" fill="#64748b">0</text><text x="290" y="150" text-anchor="middle" fill="#64748b">0</text><text x="360" y="150" text-anchor="middle" fill="#64748b">0</text><text x="430" y="150" text-anchor="middle" fill="#64748b">0</text><text x="500" y="150" text-anchor="middle" fill="#64748b">0</text>
    <text x="570" y="150" text-anchor="middle" fill="#16a34a" font-weight="700">1</text><text x="640" y="150" text-anchor="middle" fill="#16a34a" font-weight="700">1</text><text x="710" y="150" text-anchor="middle" fill="#16a34a" font-weight="700">1</text><text x="780" y="150" text-anchor="middle" fill="#16a34a" font-weight="700">1</text><text x="850" y="150" text-anchor="middle" fill="#16a34a" font-weight="700">1</text>
  </g>

  <!-- collate: shift -->
  <text x="450" y="184" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="700">collate(): x = ids[:-1]   y = ids[1:]   m = mask[1:]     → the model at position t predicts y[t] = ids[t+1]</text>

  <text x="20" y="220" font-size="12" font-weight="700" fill="#0f172a">x (input)</text>
  <g font-size="10" font-family="ui-monospace, monospace" fill="#0f172a">
    <rect x="120" y="200" width="60" height="30" rx="5" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb"/><text x="150" y="219" text-anchor="middle">&lt;|bos|&gt;</text>
    <rect x="190" y="200" width="60" height="30" rx="5" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb"/><text x="220" y="219" text-anchor="middle">&lt;|user|&gt;</text>
    <rect x="260" y="200" width="60" height="30" rx="5" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb"/><text x="290" y="219" text-anchor="middle">Write…</text>
    <rect x="330" y="200" width="60" height="30" rx="5" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb"/><text x="360" y="219" text-anchor="middle">␣kite</text>
    <rect x="400" y="200" width="60" height="30" rx="5" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb"/><text x="430" y="219" text-anchor="middle">&lt;|end|&gt;</text>
    <rect x="470" y="200" width="60" height="30" rx="5" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb"/><text x="500" y="219" text-anchor="middle">&lt;|asst|&gt;</text>
    <rect x="540" y="200" width="60" height="30" rx="5" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb"/><text x="570" y="219" text-anchor="middle">K</text>
    <rect x="610" y="200" width="60" height="30" rx="5" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb"/><text x="640" y="219" text-anchor="middle">I</text>
    <rect x="680" y="200" width="60" height="30" rx="5" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb"/><text x="710" y="219" text-anchor="middle">T</text>
    <rect x="750" y="200" width="60" height="30" rx="5" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb"/><text x="780" y="219" text-anchor="middle">E</text>
  </g>
  <!-- arrows down -->
  <g stroke="#0f172a" stroke-width="1.2" fill="none">
    <line x1="150" y1="232" x2="150" y2="246" marker-end="url(#a)"/><line x1="220" y1="232" x2="220" y2="246" marker-end="url(#a)"/><line x1="290" y1="232" x2="290" y2="246" marker-end="url(#a)"/><line x1="360" y1="232" x2="360" y2="246" marker-end="url(#a)"/><line x1="430" y1="232" x2="430" y2="246" marker-end="url(#a)"/><line x1="500" y1="232" x2="500" y2="246" marker-end="url(#a)"/><line x1="570" y1="232" x2="570" y2="246" marker-end="url(#a)"/><line x1="640" y1="232" x2="640" y2="246" marker-end="url(#a)"/><line x1="710" y1="232" x2="710" y2="246" marker-end="url(#a)"/><line x1="780" y1="232" x2="780" y2="246" marker-end="url(#a)"/>
  </g>
  <defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#0f172a"/></marker></defs>

  <text x="20" y="270" font-size="12" font-weight="700" fill="#0f172a">y (target)</text>
  <g font-size="10" font-family="ui-monospace, monospace" fill="#0f172a">
    <rect x="120" y="250" width="60" height="30" rx="5" fill="#64748b" fill-opacity="0.12" stroke="#64748b"/><text x="150" y="269" text-anchor="middle">&lt;|user|&gt;</text>
    <rect x="190" y="250" width="60" height="30" rx="5" fill="#64748b" fill-opacity="0.12" stroke="#64748b"/><text x="220" y="269" text-anchor="middle">Write…</text>
    <rect x="260" y="250" width="60" height="30" rx="5" fill="#64748b" fill-opacity="0.12" stroke="#64748b"/><text x="290" y="269" text-anchor="middle">␣kite</text>
    <rect x="330" y="250" width="60" height="30" rx="5" fill="#64748b" fill-opacity="0.12" stroke="#64748b"/><text x="360" y="269" text-anchor="middle">&lt;|end|&gt;</text>
    <rect x="400" y="250" width="60" height="30" rx="5" fill="#64748b" fill-opacity="0.12" stroke="#64748b"/><text x="430" y="269" text-anchor="middle">&lt;|asst|&gt;</text>
    <rect x="470" y="250" width="60" height="30" rx="5" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="2"/><text x="500" y="269" text-anchor="middle" font-weight="700">K</text>
    <rect x="540" y="250" width="60" height="30" rx="5" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="2"/><text x="570" y="269" text-anchor="middle" font-weight="700">I</text>
    <rect x="610" y="250" width="60" height="30" rx="5" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="2"/><text x="640" y="269" text-anchor="middle" font-weight="700">T</text>
    <rect x="680" y="250" width="60" height="30" rx="5" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="2"/><text x="710" y="269" text-anchor="middle" font-weight="700">E</text>
    <rect x="750" y="250" width="60" height="30" rx="5" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="2"/><text x="780" y="269" text-anchor="middle" font-weight="700">&lt;|end|&gt;</text>
  </g>
  <text x="20" y="304" font-size="12" font-weight="700" fill="#0f172a">m (mask)</text>
  <g font-size="12" font-family="ui-monospace, monospace">
    <text x="150" y="304" text-anchor="middle" fill="#64748b">0</text><text x="220" y="304" text-anchor="middle" fill="#64748b">0</text><text x="290" y="304" text-anchor="middle" fill="#64748b">0</text><text x="360" y="304" text-anchor="middle" fill="#64748b">0</text><text x="430" y="304" text-anchor="middle" fill="#64748b">0</text>
    <text x="500" y="304" text-anchor="middle" fill="#16a34a" font-weight="700">1</text><text x="570" y="304" text-anchor="middle" fill="#16a34a" font-weight="700">1</text><text x="640" y="304" text-anchor="middle" fill="#16a34a" font-weight="700">1</text><text x="710" y="304" text-anchor="middle" fill="#16a34a" font-weight="700">1</text><text x="780" y="304" text-anchor="middle" fill="#16a34a" font-weight="700">1</text>
  </g>
  <text x="20" y="330" font-size="12" font-weight="700" fill="#0f172a">per-token loss</text>
  <g font-size="11" font-family="ui-monospace, monospace" fill="#0f172a">
    <text x="150" y="330" text-anchor="middle" fill="#64748b">ℓ₀ × 0</text><text x="220" y="330" text-anchor="middle" fill="#64748b">ℓ₁ × 0</text><text x="290" y="330" text-anchor="middle" fill="#64748b">ℓ₂ × 0</text><text x="360" y="330" text-anchor="middle" fill="#64748b">ℓ₃ × 0</text><text x="430" y="330" text-anchor="middle" fill="#64748b">ℓ₄ × 0</text>
    <text x="500" y="330" text-anchor="middle" fill="#16a34a" font-weight="700">ℓ₅ × 1</text><text x="570" y="330" text-anchor="middle" fill="#16a34a" font-weight="700">ℓ₆ × 1</text><text x="640" y="330" text-anchor="middle" fill="#16a34a" font-weight="700">ℓ₇ × 1</text><text x="710" y="330" text-anchor="middle" fill="#16a34a" font-weight="700">ℓ₈ × 1</text><text x="780" y="330" text-anchor="middle" fill="#16a34a" font-weight="700">ℓ₉ × 1</text>
  </g>

  <g font-size="12" fill="#0f172a">
    <rect x="20" y="350" width="860" height="78" rx="8" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-opacity="0.4"/>
    <text x="34" y="372" font-weight="700">loss = Σₜ mₜ · ℓₜ  /  Σₜ mₜ     with  ℓₜ = −log p(yₜ | x₀…xₜ)</text>
    <text x="34" y="392">Read this as: average the surprise only over positions whose target is an assistant token. The first counted prediction is the one made</text>
    <text x="34" y="408">at &lt;|assistant|&gt; (it must guess K), the last is the one made at E (it must guess &lt;|end|&gt;, which is how the model learns to stop).</text>
    <text x="34" y="423" fill="#64748b">Padding (&lt;|pad|&gt;, when batch rows differ in length) gets mask 0 as well, so it never leaks into the average.</text>
  </g>
</svg>
