<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="system-ui, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">One training step in llm/train.py::train — the loop as a cycle</text>

  <!-- circle of 7 stations; center (330, 300), radius 190 -->
  <!-- 1 batch (top) -->
  <rect x="255" y="70" width="150" height="56" rx="10" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="93" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">1. get_batch</text>
  <text x="330" y="112" text-anchor="middle" font-size="11" fill="#64748b">x, y: (B, T) random windows</text>

  <!-- 2 forward (upper right) -->
  <rect x="440" y="135" width="150" height="56" rx="10" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="2"/>
  <text x="515" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">2. forward</text>
  <text x="515" y="177" text-anchor="middle" font-size="11" fill="#64748b">logits (B, T, V), autocast bf16</text>

  <!-- 3 loss (right) -->
  <rect x="500" y="272" width="150" height="56" rx="10" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="2"/>
  <text x="575" y="295" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">3. loss</text>
  <text x="575" y="314" text-anchor="middle" font-size="11" fill="#64748b">cross-entropy / grad_accum</text>

  <!-- 4 backward (lower right) -->
  <rect x="440" y="410" width="150" height="56" rx="10" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="2"/>
  <text x="515" y="433" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">4. backward</text>
  <text x="515" y="452" text-anchor="middle" font-size="11" fill="#64748b">.grad accumulates (×grad_accum)</text>

  <!-- 5 clip (bottom) -->
  <rect x="255" y="470" width="150" height="56" rx="10" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2"/>
  <text x="330" y="493" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">5. clip_grad_norm_</text>
  <text x="330" y="512" text-anchor="middle" font-size="11" fill="#64748b">‖g‖ ≤ 1.0; returns grad_norm</text>

  <!-- 6 step (lower left) -->
  <rect x="70" y="410" width="150" height="56" rx="10" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="145" y="433" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">6. optimizer.step()</text>
  <text x="145" y="452" text-anchor="middle" font-size="11" fill="#64748b">AdamW, or Muon + AdamW</text>

  <!-- 7 log (upper left) -->
  <rect x="70" y="135" width="150" height="56" rx="10" fill="#64748b" fill-opacity="0.12" stroke="#64748b" stroke-width="2"/>
  <text x="145" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">7. log / eval / ckpt</text>
  <text x="145" y="177" text-anchor="middle" font-size="11" fill="#64748b">loss, lr, grad_norm, tok/s</text>

  <!-- 0 set LR (left) -->
  <rect x="20" y="272" width="150" height="56" rx="10" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="2"/>
  <text x="95" y="295" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">0. lr_at(step)</text>
  <text x="95" y="314" text-anchor="middle" font-size="11" fill="#64748b">warmup → cosine / WSD</text>

  <!-- arrows around the cycle -->
  <path d="M410 98 Q 470 100 480 135" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M560 192 Q 590 230 580 272" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M580 328 Q 590 380 560 410" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M480 466 Q 470 500 410 498" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M250 498 Q 190 500 180 466" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M110 410 Q 80 380 90 328" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M90 272 Q 80 230 110 191" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M180 135 Q 190 100 250 98" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- inner accumulate loop arrow: backward -> batch -->
  <path d="M440 440 C 380 380, 300 330, 330 130" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="330" y="300" text-anchor="middle" font-size="11" fill="#dc2626">repeat 1–4 grad_accum times</text>
  <text x="330" y="315" text-anchor="middle" font-size="11" fill="#dc2626">before clipping and stepping</text>

  <!-- side panel: what each knob is for -->
  <g transform="translate(680,70)">
    <rect x="0" y="0" width="200" height="440" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="100" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">TrainConfig knobs</text>
    <g font-size="11" fill="#0f172a">
      <text x="12" y="52" font-weight="600">batch_size × seq_len</text>
      <text x="12" y="67" fill="#64748b">tokens per micro-batch</text>
      <text x="12" y="92" font-weight="600">grad_accum</text>
      <text x="12" y="107" fill="#64748b">bigger effective batch, same RAM</text>
      <text x="12" y="132" font-weight="600">lr, warmup_steps, schedule</text>
      <text x="12" y="147" fill="#64748b">the step size over time</text>
      <text x="12" y="172" font-weight="600">weight_decay</text>
      <text x="12" y="187" fill="#64748b">pull weights toward 0 each step</text>
      <text x="12" y="212" font-weight="600">grad_clip</text>
      <text x="12" y="227" fill="#64748b">cap the update when a batch is wild</text>
      <text x="12" y="252" font-weight="600">optimizer</text>
      <text x="12" y="267" fill="#64748b">"adamw" or "muon"</text>
      <text x="12" y="292" font-weight="600">dtype</text>
      <text x="12" y="307" fill="#64748b">"bfloat16" turns on autocast</text>
      <text x="12" y="332" font-weight="600">eval_every, ckpt_path</text>
      <text x="12" y="347" fill="#64748b">val loss + save (model, optimizer,</text>
      <text x="12" y="362" fill="#64748b">step, history) for resume</text>
      <text x="12" y="387" font-weight="600">log_every</text>
      <text x="12" y="402" fill="#64748b">History: step, loss, lr, tok/s</text>
      <text x="12" y="427" fill="#64748b">one pass = one step;</text>
      <text x="12" y="442" fill="#64748b">steps × B × T = D tokens</text>
    </g>
  </g>
  <text x="450" y="548" text-anchor="middle" font-size="12" fill="#64748b">Line numbers: 0 → train.py:127, 1 → :135, 2 → :138, 3–4 → :139, 5 → :144, 6 → :146, 7 → :149–169.</text>
</svg>
